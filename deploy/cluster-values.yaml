# Minimal shared-nothing deployment adapted from the sandbox reference.
nameOverride: starrocks-fmea
timeZone: UTC
initPassword:
  enabled: true
  passwordSecret: starrocks-admin-password
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
starrocksCluster:
  name: starrocks-fmea
  enabledBe: true
  enabledCn: false
  componentValues:
    image:
      tag: "3.5.0"
    nodeSelector:
      starrocks-lab: "true"
starrocksFESpec:
  replicas: 3
  service:
    type: ClusterIP
  feEnvVars:
    - name: LOG_CONSOLE
      value: "1"
    - name: MYSQL_PWD
      valueFrom:
        secretKeyRef:
          name: starrocks-admin-password
          key: password
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: fe
  storageSpec:
    name: fe
    storageClassName: premium-rwo
    storageSize: 100Gi
    logStorageSize: 0Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  terminationGracePeriodSeconds: 120
  startupProbeFailureSeconds: 600
  config: |
    LOG_DIR = ${STARROCKS_HOME}/log
    # Leave room inside the 4 GiB container for native memory and JVM overhead.
    JAVA_OPTS = "-Dlog4j2.formatMsgNoLookups=true -Xms1024m -Xmx2048m -XX:+UseG1GC"
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    mysql_service_nio_enabled = true
    min_graceful_exit_time_second = 25
starrocksBeSpec:
  replicas: 3
  service:
    type: ClusterIP
  beEnvVars:
    - name: MYSQL_PWD
      valueFrom:
        secretKeyRef:
          name: starrocks-admin-password
          key: password
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 16Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: be
  storageSpec:
    name: be
    storageClassName: premium-rwo
    storageSize: 100Gi
    storageCount: 1
    logStorageSize: 0Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  terminationGracePeriodSeconds: 120
  startupProbeFailureSeconds: 600
  config: |
    be_port = 9060
    webserver_port = 8040
    heartbeat_service_port = 9050
    brpc_port = 8060
    sys_log_dir = ${STARROCKS_HOME}/log
    sys_log_level = INFO
    sys_log_roll_mode = SIZE-MB-1024
    sys_log_roll_num = 3
    load_error_log_reserve_hours = 48
    default_rowset_type = beta
starrocksFeProxySpec:
  enabled: false
